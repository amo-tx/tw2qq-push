name: tw2qq 24x7 keepalive v3
on:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [relay]
permissions:
  contents: write
  actions: write
concurrency:
  group: tw2qq-keepalive
  cancel-in-progress: true
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: external keepalive
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
          GH_REPO: amo-tx/tw2qq-push
        run: bash .github/scripts/keepalive.sh
