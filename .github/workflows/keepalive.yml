name: tw2qq 24x7 keepalive

# Runs on GitHub servers only: no WorkBuddy desktop client, no user PC, no third-party account.
# The WorkBuddy free app is an on-demand sandbox and gets reclaimed when idle.
# This long-running job keeps it alive with an external HTTP request every 60s.
# GitHub Actions hard limit for one job is 6h, so we relay every 6h with 10min overlap.
on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw2qq-keepalive
  cancel-in-progress: true

jobs:
  heartbeat:
  runs-on: ubuntu-latest
  timeout-minutes: 358
  steps:
    - name: Wake cloud app continuously (350 min)
      env:
        HEALTH_URL: https://tw2qq-pusher.app.workbuddy.host/api/health?sharecode=Z3YR5C5DTB
        CHECK_URL: https://tw2qq-pusher.app.workbuddy.host/api/check?sharecode=Z3YR5C5DTB
        run: |
          set -u
          end=$((SECONDS + 21000))
          i=0
          ok=0
          miss=0
          while [ "$SECONDS" -lt "$end" ]; do
            i=$((i + 1))
            code=$(curl -sS -o /tmp/h.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 3 "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then ok=$((ok + 1)); miss=0; else miss=$((miss + 1)); fi
            if [ $((i % 30)) -eq 1 ] || [ "$code" != "200" ]; then
              echo "$(date -u +%H:%M:%S)Z [$i] HTTP $code ok=$ok"
            fi
            if [ "$miss" -ge 3 ]; then
              curl -sS -o /dev/null --max-time 60 -X POST "$CHECK_URL" || true
              echo "3 consecutive misses, triggered a check"
              miss=0
            fi
              sleep 60
            done
              echo "done: $i probes, $ok succeeded"
              if [ "$ok" -eq 0 ]; then exit 1; fi
