name: tw2qq 24x7 keepalive
on:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [relay]
permissions:
  contents: write
  actions: write
concurrency:
  group: tw2qq-keepalive
  cancel-in-progress: true
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - run: GH_TOKEN='${{ github.token }}' RELAY_PAT='${{ secrets.RELAY_PAT }}' bash .github/scripts/keepalive.sh
