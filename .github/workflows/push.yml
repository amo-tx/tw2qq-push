name: twitter2qq 定时推送

on:
  schedule:
    # 每 10 分钟一轮（UTC 计时，全天生效）。GitHub 高峰期可能延迟数分钟。
    - cron: '*/10 * * * *'
  # 首次部署后可在 Actions 页面点「Run workflow」立即验证
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitter2qq-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt

      - name: 执行一轮抓取与推送
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          CLOUD_PUBLISHABLE_KEY: ${{ secrets.CLOUD_PUBLISHABLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python run_once.py
